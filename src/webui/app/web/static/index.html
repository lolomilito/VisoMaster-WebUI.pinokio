<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VisoMaster</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header id="topbar">
  <div class="brand">VisoMaster</div>
  <div class="menu">
    <div class="dd"><button class="btn">Workspace ▾</button>
      <div class="dd-menu">
        <button data-act="ws-save">Save workspace (on server)</button>
        <button data-act="ws-load">Load workspace (browse server)…</button>
        <button data-act="ws-last" id="mLastWs">Load last workspace</button>
        <hr>
        <button data-act="ws-export">Download workspace (.json)</button>
        <button data-act="ws-import">Load workspace from this PC…</button>
      </div></div>
    <div class="dd"><button class="btn">Embeddings ▾</button>
      <div class="dd-menu">
        <button data-act="emb-export">Download embeddings (.json)</button>
        <button data-act="emb-import">Load embeddings from this PC…</button>
      </div></div>
    <div class="dd"><button class="btn">View ▾</button>
      <div class="dd-menu">
        <label><input type="checkbox" id="vLeft" checked> Left panel</label>
        <label><input type="checkbox" id="vRight" checked> Parameters panel</label>
        <label><input type="checkbox" id="vMedia" checked> Target media</label>
        <label><input type="checkbox" id="vFaces" checked> Faces</label>
        <hr>
        <button data-act="fullscreen">Fullscreen</button>
      </div></div>
  </div>
  <div class="spacer"></div>
  <div id="gpu" title="GPU memory"><div id="gpuBar"><div id="gpuFill"></div></div><span id="gpuText">GPU</span></div>
  <button class="btn" id="btnClearMem" title="Unload all models from VRAM">Clear VRAM</button>
</header>

<main id="layout">
  <aside id="left">
    <section class="panel" id="pMedia">
      <h3>Target Media
        <span class="tools">
          <button class="icon" data-act="media-folder" title="Browse server folders">📁</button>
          <button class="icon" data-act="media-files" title="Browse server files">📄</button>
          <button class="icon" data-act="media-pc" title="From this PC (your file explorer)">💻</button>
          <label class="chk" title="Show webcams"><input type="checkbox" id="chkWebcams"> Webcams</label>
        </span></h3>
      <input class="search" id="qMedia" placeholder="Filter media…">
      <div id="mediaList" class="grid media dropzone" data-drop="media"></div>
    </section>
    <section class="panel" id="pTarget">
      <h3>Target Faces
        <span class="tools">
          <button class="btn sm" id="btnFind">Find faces</button>
          <button class="btn sm" id="btnClearTf">Clear</button>
        </span></h3>
      <div id="targetList" class="grid faces"></div>
    </section>
    <section class="panel" id="pInput">
      <h3>Input Faces
        <span class="tools">
          <button class="icon" data-act="input-folder" title="Browse server folders">📁</button>
          <button class="icon" data-act="input-files" title="Browse server files">📄</button>
          <button class="icon" data-act="input-pc" title="From this PC (your file explorer)">💻</button>
        </span></h3>
      <input class="search" id="qInput" placeholder="Filter input faces…">
      <div id="inputList" class="grid faces dropzone" data-drop="input"></div>
    </section>
    <section class="panel" id="pEmb">
      <h3>Embeddings
        <span class="tools"><button class="btn sm" id="btnMakeEmb" title="Merge the selected input faces">Create embedding</button></span></h3>
      <input class="search" id="qEmb" placeholder="Filter embeddings…">
      <div id="embList" class="list"></div>
    </section>
  </aside>

  <section id="center">
    <div id="viewer">
      <div id="stage"><img id="screen" alt="" draggable="false"></div>
      <div id="viewerMsg">Select a target media</div>
      <div id="viewerHud"><span id="hudZoom"></span></div>
      <div id="modelsBusy" hidden><div class="spin"></div> Loading models… <small>(it can take a while, don't panic)</small></div>
    </div>
    <div id="transport">
      <div id="seekWrap">
        <input type="range" id="seek" min="0" max="0" value="0">
        <div id="markers"></div>
      </div>
      <div class="trow">
        <button class="btn" id="bPlay" title="Play / Stop (Space)">▶ Play</button>
        <button class="btn rec" id="bRec" title="Record (R)">● Record</button>
        <button class="btn" id="bBack" title="-1 frame (A / ←)">⏮ -1</button>
        <button class="btn" id="bFwd" title="+1 frame (D / →)">+1 ⏭</button>
        <button class="btn" id="bBack30" title="-30 frames (Z)">-30</button>
        <button class="btn" id="bFwd30" title="+30 frames (C)">+30</button>
        <input id="frameNum" type="number" min="0" value="0" title="Frame number">
        <span id="frameMax">/ 0</span>
        <span id="timeText"></span>
        <div class="spacer"></div>
        <button class="btn" id="bMPrev" title="Previous marker (Q)">⏪ Marker</button>
        <button class="btn" id="bMAdd" title="Add marker (F)">+ Marker</button>
        <button class="btn" id="bMDel" title="Remove marker (Alt+F)">− Marker</button>
        <button class="btn" id="bMNext" title="Next marker (W)">Marker ⏩</button>
      </div>
      <div class="trow">
        <label class="tgl" title="Swap faces (V)"><input type="checkbox" id="fSwap"><span>Swap Faces</span></label>
        <label class="tgl" title="Edit faces (B)"><input type="checkbox" id="fEdit"><span>Face Editor</span></label>
        <label class="tgl"><input type="checkbox" id="fMask"><span>View Face Mask</span></label>
        <label class="tgl"><input type="checkbox" id="fCompare"><span>View Face Compare</span></label>
        <div class="spacer"></div>
        <button class="btn" id="bSaveFrame" title="Save current frame (S)">Save frame</button>
        <button class="btn" id="bFit" title="Reset zoom">Fit</button>
        <label class="tgl" title="Automatically download every saved frame/video to the PC where this browser runs"><input type="checkbox" id="autoDl"><span>Download to this PC</span></label>
        <button class="btn" id="bOutputs" title="Files saved by the server (download them to this PC)">Outputs…</button>
        <input id="outFolder" placeholder="Server output folder (empty = ./outputs)" title="Output media folder on the server">
        <button class="icon" data-act="out-folder" title="Choose output folder">📁</button>
      </div>
    </div>
  </section>

  <aside id="right">
    <div id="tabs"></div>
    <div id="tabBody"></div>
    <div id="faceTools" hidden>
      <button class="btn sm" data-act="p-copy">Copy params</button>
      <button class="btn sm" data-act="p-paste">Paste params</button>
      <button class="btn sm" data-act="p-save">Save params</button>
      <button class="btn sm" data-act="p-load">Load params</button>
    </div>
  </aside>
</main>

<div id="toasts"></div>
<div id="modal" hidden><div id="modalBox"></div></div>
<div id="ctx" hidden></div>
<input type="file" id="fileHidden" hidden multiple>
<script src="/static/app.js"></script>
</body>
</html>
